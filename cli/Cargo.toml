[package]
name = "typesafe-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Command-line interface for the TypeSafe AI API, built on typesafe-sdk."
repository = "https://github.com/makbari/typesafe-rust-sdk"

[[bin]]
name = "typesafe"
path = "src/main.rs"

[dependencies]
typesafe-sdk = { path = ".." }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
