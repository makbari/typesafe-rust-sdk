[workspace]
members = ["cli"]

[package]
name = "typesafe-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Unofficial Rust client for the TypeSafe AI API, ported from the JavaScript SDK."
repository = "https://github.com/makbari/typesafe-rust-sdk"
readme = "README.md"

[dependencies]
httpdate = "1.0.3"
log = "0.4.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", default-features = false, features = ["time"] }
zstd = "0.14.3"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util"] }
